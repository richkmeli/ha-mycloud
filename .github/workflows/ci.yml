---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        run: pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check custom_components tests

      - name: Check formatting
        run: ruff format --check custom_components tests

  build:
    name: Build HACS package
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # HACS extracts the release asset into custom_components/mycloud, so the
      # integration files must be at the root of the ZIP.
      - name: Create release zip
        run: |
          cd custom_components/mycloud
          zip -r "$GITHUB_WORKSPACE/mycloud.zip" .

      - name: Verify HACS-compatible layout
        run: |
          unzip -Z1 mycloud.zip > /tmp/zip-contents.txt
          grep -qx 'manifest.json' /tmp/zip-contents.txt
          grep -qx '__init__.py' /tmp/zip-contents.txt
          if grep -q '^mycloud/' /tmp/zip-contents.txt; then
            echo "ERROR: the zip contains an enclosing mycloud/ folder" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mycloud.zip
          path: mycloud.zip
