---
name: Validate with HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # This fork is distributed as a custom HACS repository, not through the
      # default store. The upstream project has no license, so the fork cannot
      # grant one; topics and issues are GitHub settings owned by the account.
      # Those three checks therefore do not apply, while manifest, hacs.json,
      # brands and integration checks remain enforced.
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-11-14
        with:
          category: integration
          ignore: "license topics issues"
